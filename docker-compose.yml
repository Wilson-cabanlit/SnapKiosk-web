services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["npm", "run", "db:migrate"]
    volumes:
      - .:/workspace
      - node_modules_debian:/workspace/node_modules
      - wrangler_state:/workspace/backend/.wrangler
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["npm", "run", "dev", "-w", "@snapkiosk/api", "--", "--ip", "0.0.0.0"]
    ports:
      - "8787:8787"
    volumes:
      - .:/workspace
      - node_modules_debian:/workspace/node_modules
      - wrangler_state:/workspace/backend/.wrangler
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["npm", "run", "dev:admin"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8787/api/v1
    volumes:
      - .:/workspace
      - node_modules_debian:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

  gallery:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["npm", "run", "dev:gallery"]
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://localhost:8787/api/v1
    volumes:
      - .:/workspace
      - node_modules_debian:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  node_modules_debian:
  wrangler_state:
